<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7490">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dream Story 청소">
<meta name="description" content="Dream Story 청소 일정 대시보드 — 이모님·호스트 전용">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Dream Story 청소 일정">
<meta property="og:description" content="이모님·호스트 전용 청소 일정 대시보드">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e7490'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EDS%3C/text%3E%3C/svg%3E">
<title>Dream Story 청소 일정</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ───────────── 잠금 화면 ───────────── -->
<div id="lock" class="lock" hidden>
  <div class="lock-card">
    <div class="lock-logo" aria-hidden="true">🧹</div>
    <h1 class="lock-title">Dream Story</h1>
    <p class="lock-sub">청소 일정 대시보드</p>

    <div class="lock-roles" role="group" aria-label="이용 구분">
      <button type="button" class="lock-role is-on" data-lock-role="cleaner">이모님용</button>
      <button type="button" class="lock-role" data-lock-role="host">호스트 확인용</button>
    </div>

    <p class="lock-guide">4자리 비밀번호를 입력해 주세요</p>

    <div class="pin-dots" id="pinDots" aria-label="비밀번호 4자리">
      <span></span><span></span><span></span><span></span>
    </div>

    <p class="pin-error" id="pinError" role="alert" aria-live="assertive"></p>

    <div class="keypad" id="keypad">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" class="key-blank" tabindex="-1" aria-hidden="true"></button>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="del" aria-label="한 자리 지우기">⌫</button>
    </div>

    <p class="pin-hint" id="pinHint">힌트: 도어락 번호 앞 4자리</p>
  </div>
  <p class="lock-foot">Dream Story · 인천 부평</p>
</div>

<!-- ───────────── 본문 ───────────── -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">🧹</span>
      <span class="brand-text">
        <strong>Dream Story</strong>
        <small>청소 일정</small>
      </span>
    </div>
    <button type="button" id="lockBtn" class="ghost-btn" aria-label="화면 잠금">잠금</button>
  </header>

  <div class="rolebar" role="group" aria-label="화면 구분">
    <button type="button" class="role-btn is-on" data-role="cleaner">이모님용</button>
    <button type="button" class="role-btn" data-role="host">호스트 확인용</button>
  </div>

  <main id="main">

    <!-- 오늘 -->
    <section id="tab-today" class="tab" aria-labelledby="nav-today">
      <div id="summary"></div>
      <div id="todayBody"></div>
    </section>

    <!-- 다가오는 -->
    <section id="tab-upcoming" class="tab" hidden aria-labelledby="nav-upcoming">
      <h2 class="page-title">다가오는 청소 <span class="page-sub">2주 안</span></h2>
      <div id="upcomingBody"></div>
    </section>

    <!-- 전체 일정 -->
    <section id="tab-all" class="tab" hidden aria-labelledby="nav-all">
      <h2 class="page-title">전체 일정 <span class="page-sub">11월 ~ 1월</span></h2>
      <div id="calendarBody"></div>
      <h3 class="section-label">예약별 입·퇴실</h3>
      <div id="staysBody"></div>
      <h3 class="section-label">대기 중인 문의</h3>
      <div id="pendingBody"></div>
    </section>

  </main>

  <nav class="bottomnav" aria-label="화면 이동">
    <button type="button" class="nav-btn is-on" id="nav-today" data-tab="today">
      <span class="nav-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/><circle cx="12" cy="16" r="1.4" fill="currentColor" stroke="none"/></svg>
      </span><span>오늘</span>
    </button>
    <button type="button" class="nav-btn" id="nav-upcoming" data-tab="upcoming">
      <span class="nav-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M4 12h10M4 17h6"/><path d="M16 9l3 3-3 3"/></svg>
      </span><span>다가오는</span>
    </button>
    <button type="button" class="nav-btn" id="nav-all" data-tab="all">
      <span class="nav-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>
      </span><span>전체 일정</span>
    </button>
  </nav>

</div>

<!-- 데이터를 못 불러왔을 때 -->
<div id="bootError" class="boot-error" hidden>
  <div class="boot-error-card">
    <p class="boot-emoji" aria-hidden="true">📡</p>
    <h2>일정을 불러오지 못했어요</h2>
    <p>인터넷 연결을 확인하고 다시 시도해 주세요.</p>
    <button type="button" id="retryBtn" class="primary-btn">다시 불러오기</button>
  </div>
</div>

<noscript>
  <p class="noscript">이 화면을 보려면 브라우저의 자바스크립트를 켜 주세요.</p>
</noscript>

<script src="app.js"></script>
</body>
</html>
